# Drop-in for the docker daemon on the boffice host.
#
# The corporate pi-web control plane is published on the tailscale address of
# the host (100.100.20.0:30141). Docker can bind a host port only to an
# address that already exists, so the daemon must not restore containers
# before tailscaled has assigned that address. Without this ordering the
# control plane comes up without the published port and the reverse proxy
# answers 502 until somebody recreates the container by hand.
#
# Install as /etc/systemd/system/docker.service.d/10-tailscale-ordering.conf
# followed by: sudo systemctl daemon-reload && sudo systemctl restart docker
[Unit]
After=tailscaled.service
Wants=tailscaled.service
